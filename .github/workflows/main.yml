name: Build FamilyExpenses Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FamilyExpenses APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::gradlew not found in repository root."
            exit 1
          fi
          chmod +x gradlew

      - name: Prepare Environment and Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          if [ -n "$GEMINI_API_KEY" ]; then
            if grep -q '^GEMINI_API_KEY=' .env; then
              sed -i '/^GEMINI_API_KEY=/d' .env
            fi
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
            echo "Gemini API key configured."
          else
            echo "GEMINI_API_KEY secret not configured; continuing without it."
          fi

      - name: Set Up Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug keystore from Base64..."
            if ! base64 --decode debug.keystore.base64 > debug.keystore; then
              echo "::error::Failed to decode debug.keystore.base64."
              exit 1
            fi
          elif [ ! -f debug.keystore ]; then
            echo "Generating standard Android debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and Package APK
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT_DIR="build-artifacts"
          OUTPUT_APK="$OUTPUT_DIR/FamilyExpenses-debug.apk"

          if [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Debug APK was not generated at $SOURCE_APK"
            find app/build/outputs/apk -maxdepth 4 -type f -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$OUTPUT_DIR"
          cp "$SOURCE_APK" "$OUTPUT_APK"

          echo "APK generated successfully:"
          ls -lh "$OUTPUT_APK"

      - name: Upload FamilyExpenses APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyExpenses-Debug-APK
          path: build-artifacts/FamilyExpenses-debug.apk
          if-no-files-found: error
          retention-days: 30
